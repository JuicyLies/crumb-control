name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome
        run: npm run build:chrome

      - name: Build Firefox
        run: npm run build:firefox

      - name: Verify artifacts
        run: |
          test -f dist/chrome/manifest.json
          test -f dist/chrome/background.js
          test -f dist/chrome/content.js
          test -f dist/chrome/options.js
          test -f dist/firefox/manifest.json
          test -f dist/firefox/background.js
          test -f dist/firefox/content.js
          test -f dist/firefox/options.js
          echo "All artifacts present"

      - name: Verify builds loadable (manifest references)
        run: |
          node scripts/verify-build.js dist/chrome
          node scripts/verify-build.js dist/firefox

      - name: Lint
        run: npm run lint 2>/dev/null || true

      - name: Upload Chrome build
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: udp-chrome
          path: dist/chrome/

      - name: Upload Firefox build
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: udp-firefox
          path: dist/firefox/

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome
        run: npm run build:chrome

      - name: Build Firefox
        run: npm run build:firefox

      - name: Verify builds loadable
        run: |
          node scripts/verify-build.js dist/chrome
          node scripts/verify-build.js dist/firefox

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
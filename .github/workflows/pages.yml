name: Deploy Privacy Policy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'PRIVACY_POLICY.md'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build privacy policy page
        run: |
          mkdir -p _site
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Privacy Policy — Universal Data Permission Layer</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.7; color: #1a1a1a; }
              h1, h2, h3 { color: #0d0d0d; }
              h1 { border-bottom: 1px solid #e0e0e0; padding-bottom: 0.5rem; }
              table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
              th, td { border: 1px solid #e0e0e0; padding: 0.5rem; text-align: left; }
              th { background: #f5f5f5; }
              code { background: #f5f5f5; padding: 0.1rem 0.3rem; border-radius: 3px; }
              pre { background: #f5f5f5; padding: 1rem; border-radius: 5px; overflow-x: auto; }
              a { color: #0066cc; }
              .meta { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
            </style>
          </head>
          <body>
          EOF
          # Convert markdown to basic HTML
          pandoc PRIVACY_POLICY.md -f gfm -t html >> _site/index.html 2>/dev/null || {
            # Fallback if pandoc not available
            echo '<pre>' >> _site/index.html
            sed 's/&/\&/g; s/</\</g; s/>/\>/g' PRIVACY_POLICY.md >> _site/index.html
            echo '</pre>' >> _site/index.html
          }
          cat >> _site/index.html << 'EOF'
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: Bug report
description: Something is broken or behaving unexpectedly
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For a cookie banner that wasn't handled, please use the **Cookie banner not handled** template instead — it asks the right questions.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: The popup shows "Checking..." forever and never loads
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Brave
        - Opera
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Crumb Control version
      description: Shown at the top of the About tab
      placeholder: "0.4.0"
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors (optional)
      description: |
        Right-click the extension icon → Inspect popup → Console tab.
        Paste anything red. This is automatically formatted as code.
      render: shell
    validations:
      required: false
